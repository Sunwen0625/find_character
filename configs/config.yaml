arg:
  # 辨識圖片是否含角色
  do_recognition: true
  # 是否執行圖片增量
  do_augmentation: false
  # 是否訓練模型
  do_training: false
path:
  # 資料集資料夾，需包含 has_character/no_character 等分類子資料夾
  dataset_path: "data/augment_positive_images"
  # 要辨識的資料夾
  image_dir: "data/input"
  # 辨識完分類後的資料夾
  predicted_folder: "data/predicted"
  # 模型位置
  model_path: "models/model.pkl"
  # 人工驗證後的正樣本資料夾
  verified_folder: "data/verified/has_character"
  # 增量圖片輸出資料夾
  augment_folder: "data/augment_positive_images/has_character"
  # 執行增量前的暫存資料夾
  temp_folder: "data/temp_correct_image"

# 每張圖片要增量多少張
n_augments_per_image: 3
